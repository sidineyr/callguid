name: Android CI

# The repository runner is currently unavailable before any build step starts.
# Keep CI opt-in while local debug builds remain the supported test path.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Run unit tests
        run: ./gradlew testFreeDebugUnitTest --no-daemon --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleFreeDebug assembleSponsoredDebug bundleFreeRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: callguide-debug
          path: |
            app/build/outputs/apk/free/debug/app-free-debug.apk
            app/build/outputs/apk/sponsored/debug/app-sponsored-debug.apk
            app/build/outputs/bundle/freeRelease/app-free-release.aab
